# Runs the tests and the type check on every push and pull request.
# The image workflow calls this file first, so no image is published without a green test run.
# Testnet only: no secrets, no network writes. Install scripts stay off (--ignore-scripts).
name: test
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Install (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile contracts (types for the type check)
        run: npx hardhat build --quiet
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Tests (contracts with precompile mocks, agent, setup, dashboard, sponsor, installer, verifier)
        run: npx hardhat test
      - name: Verifier build is reproducible
        run: node scripts/build-verifier.mjs && git diff --exit-code web/verifier/dist/index.html
      - name: Site links resolve
        run: node scripts/check-site-links.mjs
