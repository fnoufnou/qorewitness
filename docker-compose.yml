# QoreWitness: one camera. Run the setup once, then start:
#   docker compose run --rm agent setup
#   docker compose up -d
# All state (account, device key, segments, receipts) lives in ./data.
# The image tag is pinned (QW_VERSION). Update on purpose: set QW_VERSION, then
#   docker compose pull && docker compose up -d
services:
  recorder:
    image: ghcr.io/fnoufnou/qorewitness:${QW_VERSION:-0.5.0-alpha.1}
    build:
      context: .
      args: { QW_COMMIT: "${QW_COMMIT:-unknown}" }
    command: recorder
    restart: unless-stopped
    # RTMP push only (QW_STREAM_LISTEN=1): open the port, on the camera network only.
    # ports: ["1935:1935"]
    env_file:
      - path: ./data/camera.env
        required: false
    volumes: ["./data:/data"]
  agent:
    image: ghcr.io/fnoufnou/qorewitness:${QW_VERSION:-0.5.0-alpha.1}
    build:
      context: .
      args: { QW_COMMIT: "${QW_COMMIT:-unknown}" }
    command: agent
    restart: unless-stopped
    env_file:
      - path: ./data/camera.env
        required: false
    volumes: ["./data:/data"]
    depends_on: [recorder]
  retention:
    image: ghcr.io/fnoufnou/qorewitness:${QW_VERSION:-0.5.0-alpha.1}
    command: retention
    restart: unless-stopped
    env_file:
      - path: ./data/camera.env
        required: false
    volumes: ["./data:/data"]
  ui:
    image: ghcr.io/fnoufnou/qorewitness:${QW_VERSION:-0.5.0-alpha.1}
    command: ui
    restart: unless-stopped
    env_file:
      - path: ./data/camera.env
        required: false
    volumes: ["./data:/data:ro"]
    # Local only. The token link is in: docker compose logs ui
    ports: ["127.0.0.1:8080:8080"]
