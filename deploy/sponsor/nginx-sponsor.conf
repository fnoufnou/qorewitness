# Sponsor API on the existing site (qorewitness.fnoufnou.com).
# Put this inside the existing `server { ... }` block for port 443.
# /sponsor/v1/challenge -> http://127.0.0.1:8787/v1/challenge (the prefix is stripped).
location /sponsor/ {
    # No nginx access log for this path: the service logs truncated IPs only (14 days).
    access_log off;
    limit_except GET POST { deny all; }
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The service trusts this header only from 127.0.0.1 (SPONSOR_TRUSTED_PROXIES).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
}
